[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpost"
version = "1.0.0"
description = "Draft-only LinkedIn Post Kits from your real GitHub activity — with proof links."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
proofpost = "proofpost.cli:main"

[tool.setuptools.packages.find]
include = ["proofpost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
